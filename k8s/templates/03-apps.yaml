# 03-apps.yaml
# Application workloads: Governance Engine, Agent Orchestrator, Dashboard.
# All pinned to Worker 2 (node-role=datastore) alongside the databases.
# Matches hardware_requirements.md Node 3 assignment.

# ── Governance Engine ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-engine
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governance-engine
  template:
    metadata:
      labels:
        app: governance-engine
    spec:
      serviceAccountName: governance-engine-sa
      nodeSelector:
        node-role: datastore
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.${NAMESPACE}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.27.0
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
        - name: governance-engine
          image: ${REGISTRY}/governance-engine:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/${POSTGRES_DB}"
            - name: CERBOS_URL
              value: "http://cerbos.${NAMESPACE}.svc.cluster.local:3592"
            - name: MINIO_ENDPOINT
              value: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              value: "${MINIO_ROOT_USER}"
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: minio-root-password
            - name: MINIO_BUCKET
              value: "manifold-evidence"
            - name: AUDIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: audit-hmac-secret
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_HOST
              value: "http://langfuse.${NAMESPACE}.svc.cluster.local:3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.${NAMESPACE}.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "governance-engine"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config-gov
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: governance-engine
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  ports:
    - port: 8443
      targetPort: 8443
      name: mtls
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
  selector:
    app: governance-engine
---
# ── Agent Orchestrator ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
    spec:
      serviceAccountName: agent-orchestrator-sa
      nodeSelector:
        node-role: datastore
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.${NAMESPACE}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-governance
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z governance-engine.${NAMESPACE}.svc.cluster.local 8443; do echo waiting for governance-engine; sleep 3; done']
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.27.0
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
          ports:
            - containerPort: 8000
              name: envoy-proxy
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
        - name: agent-orchestrator
          image: ${REGISTRY}/agent-orchestrator:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/${POSTGRES_DB}"
            - name: GOVERNANCE_ENGINE_URL
              value: "http://127.0.0.1:8000"
            - name: LLM_GATEWAY_URL
              value: "http://litellm.${NAMESPACE}.svc.cluster.local:4000/v1"
            - name: LLM_MODEL
              value: "mistral-cpu"
            - name: EMBEDDING_MODEL
              value: "qwen3-embedding"
            - name: CERBOS_URL
              value: "http://cerbos.${NAMESPACE}.svc.cluster.local:3592"
            - name: QDRANT_URL
              value: "http://qdrant.${NAMESPACE}.svc.cluster.local:6333"
            - name: QDRANT_COLLECTION
              value: "manifold_kb"
            - name: REDIS_URL
              value: "redis://:${REDIS_PASSWORD}@redis.${NAMESPACE}.svc.cluster.local:6379/0"
            - name: AUDIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: audit-hmac-secret
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_HOST
              value: "http://langfuse.${NAMESPACE}.svc.cluster.local:3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.${NAMESPACE}.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "agent-orchestrator"
            - name: LITELLM_MASTER_KEY
              value: "sk-litellm-master-secure-pass"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1.5Gi"
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config-orchestrator
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30081
  selector:
    app: agent-orchestrator
---
# ── Dashboard ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      nodeSelector:
        node-role: datastore
      containers:
        - name: dashboard
          image: ${REGISTRY}/dashboard:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: REACT_APP_ORCHESTRATOR_URL
              value: "http://${MASTER_NODE_IP}:30081"
            - name: REACT_APP_GOVERNANCE_URL
              value: "http://${MASTER_NODE_IP}:30080"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
  selector:
    app: dashboard

---
# ── Internal MCP Server RBAC ─────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-role
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: ${NAMESPACE}
---
# ── Internal MCP Server ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      nodeSelector:
        node-role: ai-gateway
      containers:
        - name: mcp-server
          image: ${REGISTRY}/mcp-server:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: CERBOS_URL
              value: "http://cerbos.${NAMESPACE}.svc.cluster.local:3592"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
  selector:
    app: mcp-server
