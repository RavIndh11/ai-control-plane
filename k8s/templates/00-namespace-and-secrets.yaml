# 00-namespace-and-secrets.yaml
# Creates the control-plane namespace and all shared secrets.
# Applied first before any other manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: Secret
metadata:
  name: datastore-secrets
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  postgres-password:        "${POSTGRES_PASSWORD}"
  redis-password:           "${REDIS_PASSWORD}"
  minio-root-password:      "${MINIO_ROOT_PASSWORD}"
  qdrant-api-key:           "qdrant-master-secure-api-key"
  litellm-master-key:       "sk-litellm-master-secure-pass"
  langfuse-public-key:      "pk-lf-master-secure-public-key"
  langfuse-secret-key:      "sk-lf-master-secure-secret-key"
  langfuse-nextauth-secret: "langfuse-auth-secret-key-secure"
  langfuse-salt:            "langfuse-salt-value-for-hashing"
  langfuse-encryption-key:  "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  audit-hmac-secret:        "${AUDIT_HMAC_SECRET}"
---
# ServiceAccount for the Agent Orchestrator (used by SPIRE in Phase 2)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-orchestrator-sa
  namespace: ${NAMESPACE}
---
# ServiceAccount for the Governance Engine (used by SPIRE in Phase 2)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-engine-sa
  namespace: ${NAMESPACE}
