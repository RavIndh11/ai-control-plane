# 02-platform.yaml
# Platform services: Cerbos (ABAC), LiteLLM (AI gateway),
# Langfuse (LLM observability), OTel Collector, Ollama ExternalName.
# Cerbos / LiteLLM / Langfuse / OTel all run on Worker 1 (node-role=ai-gateway).

# ── Cerbos ABAC Policy Decision Point ────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerbos-policies
  namespace: ${NAMESPACE}
data:
  agent_threads.yaml: |
    apiVersion: api.cerbos.dev/v1
    resourcePolicy:
      version: "default"
      resource: "agent_thread"
      rules:
        - actions: ["*"]
          effect: EFFECT_ALLOW
          roles: [super-admin]
        - actions: ["read", "write"]
          effect: EFFECT_ALLOW
          roles: [tenant-user]
          condition:
            match:
              expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
        - actions: ["read", "write", "delete"]
          effect: EFFECT_ALLOW
          roles: [tenant-admin]
          condition:
            match:
              expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
  compliance_evidence.yaml: |
    apiVersion: api.cerbos.dev/v1
    resourcePolicy:
      version: "default"
      resource: "compliance_evidence"
      rules:
        - actions: ["*"]
          effect: EFFECT_ALLOW
          roles: [super-admin]
        - actions: ["read"]
          effect: EFFECT_ALLOW
          roles: [compliance-auditor]
        - actions: ["read"]
          effect: EFFECT_ALLOW
          roles: [tenant-admin]
          condition:
            match:
              expr: request.resource.attr.tenant_id == request.principal.attr.tenant_id
        - actions: ["create"]
          effect: EFFECT_ALLOW
          roles: [system-workload, agent-orchestrator, tenant-admin, tenant-user]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerbos
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cerbos
  template:
    metadata:
      labels:
        app: cerbos
    spec:
      nodeSelector:
        node-role: ai-gateway
      containers:
        - name: cerbos
          image: ghcr.io/cerbos/cerbos:0.36.0
          args:
            - server
            - --config=/etc/cerbos/config.yaml
          ports:
            - containerPort: 3592
              name: http
            - containerPort: 3593
              name: grpc
          volumeMounts:
            - name: policies
              mountPath: /policies
            - name: cerbos-config
              mountPath: /etc/cerbos
          readinessProbe:
            httpGet:
              path: /_cerbos/health
              port: 3592
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: policies
          configMap:
            name: cerbos-policies
        - name: cerbos-config
          configMap:
            name: cerbos-server-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerbos-server-config
  namespace: ${NAMESPACE}
data:
  config.yaml: |
    server:
      httpListenAddr: ":3592"
      grpcListenAddr: ":3593"
    storage:
      driver: disk
      disk:
        directory: /policies
        watchForChanges: true
---
apiVersion: v1
kind: Service
metadata:
  name: cerbos
  namespace: ${NAMESPACE}
spec:
  ports:
    - name: http
      port: 3592
      targetPort: 3592
    - name: grpc
      port: 3593
      targetPort: 3593
  selector:
    app: cerbos
---
# ── LiteLLM AI Gateway ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ${NAMESPACE}
data:
  config.yaml: |
    model_list:
      - model_name: mistral-cpu
        litellm_params:
          model: ollama/steamdj/mistral-cpu-only:latest
          api_base: http://ollama.${NAMESPACE}.svc.cluster.local:11434
          tpm: 100000
          rpm: 60
      - model_name: llama3.1-cpu
        litellm_params:
          model: ollama/steamdj/llama3.1-cpu-only:latest
          api_base: http://ollama.${NAMESPACE}.svc.cluster.local:11434
          tpm: 100000
          rpm: 40
      - model_name: qwen3-embedding
        litellm_params:
          model: ollama/qwen3-embedding:4b
          api_base: http://ollama.${NAMESPACE}.svc.cluster.local:11434
          input_cost_per_token: 0
          output_cost_per_token: 0
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      timeout: 60
      retry_after: 5
    litellm_settings:
      drop_params: true
      telemetry: false
      fallbacks:
        - mistral-cpu:
            - llama3.1-cpu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      nodeSelector:
        node-role: ai-gateway
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/${POSTGRES_DB}"
            - name: REDIS_HOST
              value: "redis.${NAMESPACE}.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: redis-password
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: litellm-master-key
            - name: LITELLM_LOG
              value: "INFO"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_HOST
              value: "http://langfuse.${NAMESPACE}.svc.cluster.local:3000"
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
  type: NodePort
  selector:
    app: litellm
---
# ── Langfuse LLM Observability ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      nodeSelector:
        node-role: ai-gateway
      initContainers:
        # Wait for Postgres to be ready before starting Langfuse
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.${NAMESPACE}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: langfuse
          image: langfuse/langfuse:2.92.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/langfuse"
            - name: NEXTAUTH_URL
              value: "http://${MASTER_NODE_IP}:30083"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-nextauth-secret
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-salt
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-encryption-key
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: PORT
              value: "3000"
            - name: LANGFUSE_DEBUG
              value: "true"
            - name: LANGFUSE_LOG_LEVEL
              value: "DEBUG"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30083
  selector:
    app: langfuse
---
# ── OpenTelemetry Collector ───────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ${NAMESPACE}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      logging:
        verbosity: normal
      # Traces also forwarded to Langfuse via OTLP HTTP (Langfuse v2 compatible)
      otlphttp/langfuse:
        endpoint: http://langfuse.${NAMESPACE}.svc.cluster.local:3000/api/public/otel
        headers:
          Authorization: "Basic ${LANGFUSE_BASIC_AUTH}"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging, otlphttp/langfuse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      nodeSelector:
        node-role: ai-gateway
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.100.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ${NAMESPACE}
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector
---
# ── Ollama — ExternalName service pointing to the LAN Ollama machine ──────
# This lets pods call http://ollama.<namespace>.svc.cluster.local:11434
# and it resolves to the actual Ollama machine IP.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ${NAMESPACE}
spec:
  type: ExternalName
  externalName: "${OLLAMA_HOST_IP}"
  ports:
    - port: 11434
      targetPort: 11434
