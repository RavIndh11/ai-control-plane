# 02-platform.yaml
# Platform services: LiteLLM (AI gateway), Langfuse (LLM observability),
# OTel Collector, Ollama ExternalName.
# LiteLLM / Langfuse / OTel all run on Worker 1 (node-role=ai-gateway).

# ── LiteLLM AI Gateway ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ${NAMESPACE}
data:
  config.yaml: |
    model_list:
      - model_name: mistral-cpu
        litellm_params:
          model: ollama/steamdj/mistral-cpu-only
          api_base: http://${OLLAMA_HOST_IP}:11434
          tpm: 100000
          rpm: 60
      - model_name: llama3.1-cpu
        litellm_params:
          model: ollama/steamdj/llama3.1-cpu-only
          api_base: http://${OLLAMA_HOST_IP}:11434
          tpm: 100000
          rpm: 40
      - model_name: qwen3-embedding
        litellm_params:
          model: ollama/qwen3-embedding:4b
          api_base: http://${OLLAMA_HOST_IP}:11434
          input_cost_per_token: 0
          output_cost_per_token: 0
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      timeout: 60
      retry_after: 5
    litellm_settings:
      drop_params: true
      telemetry: false
      success_callbacks: ["langfuse"]
      failure_callbacks: ["langfuse"]
      cache: true
      cache_params:
        type: redis
        host: redis.${NAMESPACE}.svc.cluster.local
        port: 6379
        password: "os.environ/REDIS_PASSWORD"
      fallbacks:
        - mistral-cpu:
            - llama3.1-cpu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/${POSTGRES_DB}"
            - name: REDIS_HOST
              value: "redis.${NAMESPACE}.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: redis-password
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: litellm-master-key
            - name: LITELLM_LOG
              value: "INFO"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_HOST
              value: "http://langfuse.${NAMESPACE}.svc.cluster.local:3000"
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
  type: NodePort
  selector:
    app: litellm
---
# ── Langfuse LLM Observability ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      initContainers:
        # Wait for Postgres to be ready before starting Langfuse
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.${NAMESPACE}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: langfuse
          image: langfuse/langfuse:3.224.2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/langfuse"
            - name: NEXTAUTH_URL
              value: "http://${MASTER_NODE_IP}:30083"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-nextauth-secret
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-salt
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-encryption-key
            - name: REDIS_HOST
              value: "redis.${NAMESPACE}.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: redis-password
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: NEXT_PUBLIC_TELEMETRY_ENABLED
              value: "false"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: PORT
              value: "3000"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.${NAMESPACE}.svc.cluster.local:8123"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: "dummy_pass"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse-events"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: "${MINIO_ROOT_USER}"
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: minio-root-password
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://clickhouse.${NAMESPACE}.svc.cluster.local:9000"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
            - name: LANGFUSE_INIT_ORG_ID
              value: "manifold-org"
            - name: LANGFUSE_INIT_ORG_NAME
              value: "Manifold Finance"
            - name: LANGFUSE_INIT_PROJECT_ID
              value: "manifold-project"
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: "Enterprise AI Control Plane"
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_INIT_USER_EMAIL
              value: "admin@manifold.finance"
            - name: LANGFUSE_INIT_USER_PASSWORD
              value: "Admin123!"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: ${NAMESPACE}
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30083
  selector:
    app: langfuse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.${NAMESPACE}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-clickhouse
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z clickhouse.${NAMESPACE}.svc.cluster.local 8123; do echo waiting for clickhouse; sleep 2; done']
        - name: create-s3-bucket
          image: minio/mc
          command:
            - sh
            - -c
            - "mc alias set myminio http://minio.${NAMESPACE}.svc.cluster.local:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb myminio/langfuse-events --ignore-existing"
          env:
            - name: MINIO_ROOT_USER
              value: "${MINIO_ROOT_USER}"
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: minio-root-password
      containers:
        - name: langfuse-worker
          image: langfuse/langfuse-worker:3.224.2
          env:
            - name: DATABASE_URL
              value: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.${NAMESPACE}.svc.cluster.local:5432/langfuse"
            - name: NEXTAUTH_URL
              value: "http://${MASTER_NODE_IP}:30083"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-nextauth-secret
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-salt
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: langfuse-encryption-key
            - name: REDIS_HOST
              value: "redis.${NAMESPACE}.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: redis-password
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.${NAMESPACE}.svc.cluster.local:8123"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: "dummy_pass"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse-events"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: "${MINIO_ROOT_USER}"
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: datastore-secrets
                  key: minio-root-password
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://clickhouse.${NAMESPACE}.svc.cluster.local:9000"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1024"
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "langfuse"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
---
# ── OpenTelemetry Collector ───────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ${NAMESPACE}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      logging:
        verbosity: normal
      # Traces also forwarded to Langfuse via OTLP HTTP (Langfuse v2 compatible)
      otlphttp/langfuse:
        endpoint: http://langfuse.${NAMESPACE}.svc.cluster.local:3000/api/public/otel
        headers:
          Authorization: "Basic ${LANGFUSE_BASIC_AUTH}"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging, otlphttp/langfuse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.100.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ${NAMESPACE}
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector
---
# ── Ollama — Endpoints service pointing to the LAN Ollama machine ───────────
# This lets pods call http://ollama.<namespace>.svc.cluster.local:11434
# and it resolves to the actual Ollama machine IP.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: ${NAMESPACE}
subsets:
  - addresses:
      - ip: "${OLLAMA_HOST_IP}"
    ports:
      - port: 11434
