# LiteLLM API Gateway Helm Configurations
# File: platform/runtime/litellm/values.yaml

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest
  pullPolicy: IfNotPresent

# Mount the LiteLLM config file
config: |
  model_list:
    # ── Primary chat model: CPU-optimised Mistral ──────────────────────────
    - model_name: mistral-cpu
      litellm_params:
        model: ollama/steamdj/mistral-cpu-only:latest
        api_base: http://ollama.control-plane.svc.cluster.local:11434
        tpm: 100000
        rpm: 60

    # ── Fallback chat model: CPU-optimised LLaMA 3.1 ──────────────────────
    - model_name: llama3.1-cpu
      litellm_params:
        model: ollama/steamdj/llama3.1-cpu-only:latest
        api_base: http://ollama.control-plane.svc.cluster.local:11434
        tpm: 100000
        rpm: 40

    # ── Embedding model: Qwen3 4B (for RAG context search) ────────────────
    - model_name: qwen3-embedding
      litellm_params:
        model: ollama/qwen3-embedding:4b
        api_base: http://ollama.control-plane.svc.cluster.local:11434
        # Map to OpenAI embeddings API shape
        input_cost_per_token: 0
        output_cost_per_token: 0

  router_settings:
    routing_strategy: least-busy
    num_retries: 2
    timeout: 60                  # CPU inference is slower — give it time
    retry_after: 5

  litellm_settings:
    drop_params: true
    set_headers:
      x-litellm-proxy: "true"
    telemetry: false
    # Fallback chain: if mistral-cpu is busy, try llama3.1-cpu
    fallbacks:
      - mistral-cpu:
          - llama3.1-cpu

# Database configurations for tracking spend, tokens, and custom API keys
extraEnv:
  - name: DATABASE_URL
    value: "postgresql://postgres:postgres-secure-pass@postgres.control-plane.svc.cluster.local:5432/ai_control_plane"
  - name: REDIS_HOST
    value: "redis.control-plane.svc.cluster.local"
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    value: "redis-secure-pass"
  - name: LITELLM_MASTER_KEY
    value: "sk-litellm-master-secure-pass"
  - name: LITELLM_LOGGING
    value: '["langfuse"]'
  - name: LANGFUSE_PUBLIC_KEY
    value: "pk-lf-master-secure-public-key"
  - name: LANGFUSE_SECRET_KEY
    value: "sk-lf-master-secure-secret-key"
  - name: LANGFUSE_HOST
    value: "http://langfuse.control-plane.svc.cluster.local:3000"

service:
  type: ClusterIP
  port: 4000
