apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: mcp_tool
  rules:
    - actions:
        - execute
      effect: EFFECT_ALLOW
      roles:
        - compliance-agent
      condition:
        match:
          expr: request.resource.id == 'fetch_compliance_policy'

    - actions:
        - execute
      effect: EFFECT_ALLOW
      roles:
        - data-analyst-agent
        - admin
      condition:
        match:
          expr: request.resource.id == 'query_user_data'
